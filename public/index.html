<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보처리기사 기출문제 풀이</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div class="phone-wrapper">
    <div class="header" style="display:none;">
        <span class="header-btn" onclick="exitToDashboard()">Back</span>
        <span id="header-center-title">기출 메인</span>
        <span class="header-btn" style="visibility:hidden;">Info</span>
    </div>

    <div class="body-container" id="view-renderer">
        <!-- 자바스크립트가 모드 선택 화면을 먼저 렌더링합니다 -->
    </div>

    <div class="tab-fixed-bar" style="display:none;">
        <div class="tab-unit active" id="tab-all" onclick="switchMainTab('all')">
            <div class="tab-icon-img">📋</div>
            <div>All</div>
        </div>
        <div class="tab-unit" id="tab-my" onclick="switchMainTab('my')">
            <div class="tab-icon-img">⭐</div>
            <div>My</div>
        </div>
        <div class="tab-unit" id="tab-analysis" onclick="switchMainTab('analysis')">
            <div class="tab-icon-img">📊</div>
            <div>분석</div>
        </div>
        <div class="tab-unit" onclick="window.openFeedbackModal()">
            <div class="tab-icon-img">💡</div>
            <div>제보하기</div>
        </div>
        <div class="tab-unit" id="tab-switch" onclick="switchAppMode()">
            <div class="tab-icon-img">🔄</div>
            <div id="tab-switch-text">모드 전환</div>
        </div>
    </div>
</div>

<script src="app.js?v=20261020_02"></script>
</body>
</html>
