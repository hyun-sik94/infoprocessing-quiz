name: Auto Deploy to OCI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Remote SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # 명령 하나라도 실패하면 배포를 멈추고 Actions를 실패로 표시한다.
            # (2026-11-16 이전에는 git pull 실패를 무시해서 서버가 3주 동안 옛 코드인데도 "성공"으로 보였다)
            set -e
            cd /home/ubuntu/infoprocessing-quiz
            # 이력을 다시 쓴 경우(강제 push)에도 배포되도록 pull 대신 원격 main으로 맞춘다.
            # feedback.db 등 git이 추적하지 않는 파일은 그대로 남는다. 서버에서 직접 고친 추적 파일은 사라진다.
            git fetch origin main
            git reset --hard origin/main
            echo "Node $(node -v), 배포 커밋 $(git log -1 --format='%h %s')"
            npm install --omit=dev
            pm2 reload quiz-app || pm2 restart quiz-app
            pm2 save

            # 상태 확인: 앱이 실제로 응답하고, 크래시 반복(재시작 횟수 증가)이 없어야 성공이다.
            APP_URL="http://127.0.0.1:3000/api/quiz/rounds?type=written"
            restarts() { pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="quiz-app");console.log(p?p.pm2_env.restart_time:-1)})'; }
            ok=""
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null --max-time 5 "$APP_URL"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "배포 실패: 재시작 후 40초 동안 앱이 응답하지 않습니다"
              pm2 logs quiz-app --lines 40 --nostream || true
              exit 1
            fi
            before=$(restarts)
            sleep 10
            after=$(restarts)
            if [ "$before" != "$after" ] || ! curl -fsS -o /dev/null --max-time 5 "$APP_URL"; then
              echo "배포 실패: 앱이 반복해서 재시작됩니다 (재시작 횟수 $before → $after)"
              pm2 logs quiz-app --lines 40 --nostream || true
              exit 1
            fi
            echo "상태 확인 통과 (재시작 횟수 $after)"

            # pm2 로그가 디스크를 채우지 않도록: 처음 한 번만 설치, 10MB마다 나누고 7개 보관(압축)
            pm2 describe pm2-logrotate > /dev/null 2>&1 || pm2 install pm2-logrotate
            pm2 set pm2-logrotate:max_size 10M > /dev/null
            pm2 set pm2-logrotate:retain 7 > /dev/null
            pm2 set pm2-logrotate:compress true > /dev/null
